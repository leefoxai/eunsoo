# AI 코치 서버 함수(supabase/functions/coach)를 Supabase에 배포한다.
# 필요한 GitHub 저장소 비밀값(Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — Supabase 계정 → Access Tokens에서 만든 토큰
#   SUPABASE_PROJECT_ID    — 프로젝트 ref(대시보드 주소 /project/<ref>)
# ANTHROPIC_API_KEY는 여기 두지 않는다 — Supabase 대시보드 Edge Functions → Secrets에 저장.
name: Deploy coach function

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml', '.github/workflows/deploy-coach.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID 저장소 비밀값을 먼저 등록하세요"; exit 1
          fi
      - name: Deploy
        run: |
          set -o pipefail
          supabase --version
          if ! supabase functions deploy coach --project-ref "$PROJECT_ID" --no-verify-jwt 2>&1 | tee deploy.log; then
            # 실패 원인을 주석(annotation)으로 남겨 Actions 요약 화면에서 바로 보이게 한다
            msg=$(tail -n 15 deploy.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=supabase functions deploy 실패::${msg}"
            exit 1
          fi
